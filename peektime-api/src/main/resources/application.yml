spring:
  application:
    name: peaktime-api
  profiles:
    active: local
  # LLM 엔드포인트가 async servlet으로 동작하므로 Gemini 최대 대기(connect 5s + read 30s)보다 길게 설정
  mvc:
    async:
      request-timeout: 40s
  jpa:
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

logging:
  level:
    org.springframework.web: INFO
    com.team.peektime_api: INFO

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}

admin:
  base-url: ${ADMIN_BASE_URL:http://localhost:8081}

gemini:
  api-key: ${GEMINI_API_KEY:}
  # flash-lite: 지연시간 최소 계열. 미션 1개 생성(짧은 JSON)에는 품질 충분
  # 주의: 2.5-flash-lite는 신규 Google 프로젝트(새 API 키)에서 404로 거절됨 → 3.1로 고정
  model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
  endpoint: ${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}

cloud:
  aws:
    s3:
      bucket: peaktime-932316879839-ap-northeast-2-an
    cloudfront:
      base-url: ${CLOUDFRONT_BASE_URL:https://d5visb3gnqmrn.cloudfront.net}
    region: ap-northeast-2

firebase:
  credentials-path: classpath:firebase/firebase-service-account.json

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true
