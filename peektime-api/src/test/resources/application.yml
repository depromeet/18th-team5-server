spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    database-platform: org.hibernate.dialect.H2Dialect
  # data.sql은 MySQL 전용 문법(INSERT IGNORE)이라 H2 테스트에서 실행하지 않는다 (local과 동일)
  sql:
    init:
      mode: never
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: test-secret-key-for-junit-test-only
  access-expiration: 3600000
  refresh-expiration: 2592000000

cloud:
  aws:
    credentials:
      access-key: test-access-key
      secret-key: test-secret-key
    s3:
      bucket: test-bucket
    cloudfront:
      base-url: https://test.cloudfront.net
    region: ap-northeast-2

gemini:
  api-key: test-api-key
  model: test-model
  endpoint: http://localhost:9999

admin:
  base-url: http://localhost:8081

firebase:
  credentials-path: classpath:firebase/firebase-service-account.json